<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NerdNexus</title>
  <!-- CSS está na pasta css -->
  <link rel="stylesheet" href="site.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <!-- ESQUERDA: LOGO + NOME -->
    <div class="brand">
      <div class="logo">
        <img src="logo.jpg" alt="Logo NerdNexus">
      </div>
      <div class="brand-info">
        <h1>NerdNexus</h1>
        <div class="muted" style="font-size:13px;">Roupas e acessórios geeks</div>
      </div>
    </div>

    <!-- CENTRO: MENU -->
    <nav class="nav">
      <ul class="menu">
        <li><a href="site.html">HOME</a></li>
        <li><a href="sobre.html">SOBRE</a></li>

        <!-- Dropdown CATEGORIAS -->
        <li class="dropdown">
          <a href="#">CATEGORIAS</a>
          <div class="dropdown-content">
            <button class="category-btn" data-category="all">Todos</button>
            <button class="category-btn" data-category="camisetas">Camisetas</button>
            <button class="category-btn" data-category="canecas">Canecas</button>
            <button class="category-btn" data-category="Colecionáveis">Colecionáveis</button>
            <button class="category-btn" data-category="moletons">Moletons</button>
            <button class="category-btn" data-category="Caderno">Caderno</button>
             <button class="category-btn" data-category="acessorios">acessórios</button>
          </div>
        </li>

        <li>
  <a href="#" id="estoqueBtn" style="display:flex;align-items:center;gap:6px;">
    ESTOQUE
    <!-- Ícone Cadeado SVG -->
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </a>
</li>

      </ul>
    </nav>

    <!-- DIREITA: LOGIN + CARRINHO -->
    <div class="header-actions">
      <a href="login.html" class="btn btn-ghost">Login</a>
      <button id="cartBtn" class="btn btn-ghost">
        Carrinho <span id="cartCount" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <!-- SEÇÃO DE NOVIDADES -->
    <div class="intro">
      <div>
        <h2>Novidades</h2>
        <p class="muted">Escolha seu look geek favorito.</p>
      </div>
      <div class="muted small">Com grandes poderes vem grandes responsabilidades <i>Tio Ben</i></div>
    </div>

    <section class="grid" id="products"></section>
  </main>

  <!-- DRAWER / CARRINHO -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-weight:800;font-size:18px;color:var(--purple-700)">Seu Carrinho</div>
      <button id="closeDrawer" class="btn">Fechar</button>
    </div>
    <div id="cartList"></div>
    <div style="margin-top:14px;border-top:1px solid rgba(0,0,0,0.04);padding-top:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;">
        <div>Total</div>
        <div id="cartTotal">R$ 0.00</div>
      </div>
      <button id="checkoutBtn" class="btn" style="margin-top:12px;width:100%;
        background:linear-gradient(90deg,var(--purple-600),var(--purple-500));
        color:white;border-radius:8px">
        Finalizar Compra
      </button>
    </div>
  </aside>

  <!-- FOOTER -->
  <footer>
    © <span id="year"></span> Loja Geek — Todos os direitos reservados
  </footer>

  <!-- SCRIPTS -->
  <script src="sites.js"></script>

</body>
</html>
